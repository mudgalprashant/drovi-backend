spring:
  application:
    name: drovi-backend

  datasource:
    # Supabase, via the SUPAVISOR SESSION POOLER — not the direct connection.
    #
    #   host: aws-0-<region>.pooler.supabase.com   port: 5432
    #   user: postgres.<project-ref>
    #
    # Three things make this the only workable choice, and each one fails in a
    # different confusing way if ignored:
    #
    #  1. Supabase DIRECT connections are IPv6-only unless you buy the IPv4
    #     add-on. Most container hosts have no IPv6 egress, so a direct URL
    #     fails to connect at all — and the error looks like a firewall problem.
    #  2. The pooler's TRANSACTION mode (port 6543) does not support prepared
    #     statements, which Hibernate and Flyway both rely on. SESSION mode
    #     (5432) does. Same host, different port, completely different semantics.
    #  3. Flyway takes a Postgres advisory lock around a migration. Advisory
    #     locks are connection-scoped, so under transaction pooling the lock can
    #     be taken on one backend and released on another. Session mode keeps
    #     one client on one backend for the life of the connection.
    url: ${DROVI_DB_URL:jdbc:postgresql://localhost:5432/drovi}
    username: ${DROVI_DB_USERNAME:postgres}
    password: ${DROVI_DB_PASSWORD:}
    hikari:
      # Sized against the DATABASE's limit, not expected load. Supabase's free
      # tier is small and shared, and exhausting it takes out every other client
      # of that project — including the SQL editor you would use to diagnose it.
      maximum-pool-size: ${DROVI_DB_POOL_MAX:5}
      minimum-idle: 1
      connection-timeout: 10000
      # Must be BELOW max-lifetime, or Hikari logs
      #   "idleTimeout is close to or more than maxLifetime, disabling it"
      # and silently stops reaping idle connections — which on a shared pooler means
      # holding connections other clients of the project need.
      idle-timeout: 120000
      # Must stay below the pooler's own idle timeout, or Hikari hands out a
      # connection the pooler has already closed and the first query fails.
      max-lifetime: 240000
      keepalive-time: 120000

  jpa:
    # Flyway owns the schema. Hibernate must never alter it: ddl-auto on a real
    # database is how a column quietly disappears in production.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

    # Supabase's `public` schema is NOT empty on a new project, and Flyway refuses to
    # migrate into a non-empty schema with no history table:
    #
    #   Found non-empty schema(s) "public" but no schema history table.
    #
    # baseline-on-migrate lets it adopt the existing schema and carry on.
    baseline-on-migrate: true

    # ⚠️ THIS LINE IS LOAD-BEARING. baseline-version defaults to 1, and Flyway applies
    # only migrations ABOVE the baseline — so with the default, V1__baseline would be
    # silently skipped and the app would start against a database with none of our 18
    # tables. The first failure would be Hibernate's `validate` complaining about a
    # missing table, which points nowhere near this setting.
    #
    # 0 means "baseline is before everything", so V1 onwards all run.
    baseline-version: 0

    # We use no Flyway placeholders, and Flyway's ${...} syntax collides with anything
    # that legitimately contains ${} in SQL — including inside comments, which it also
    # scans. Leaving substitution off removes a whole class of migration failure that
    # only ever appears at deploy time.
    placeholder-replacement: false

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=10m

  threads:
    virtual:
      enabled: true

# Firebase owns identity: we verify ID tokens and never issue them.
#
# project-id is deliberately NOT defaulted here. Spring binds it from the
# DROVI_FIREBASE_PROJECT_ID environment variable, and its ABSENCE is meaningful:
# with no project configured there is no JwtDecoder, and every console route
# fails closed with AUTH_NOT_CONFIGURED. Writing `${DROVI_FIREBASE_PROJECT_ID:}`
# here would defeat that -- the property would be present but blank, and the
# decoder would be built for a project named "".
#
# No service-account credential is needed to VERIFY a token: Firebase ID tokens
# are RS256 JWTs signed with keys Google publishes as a JWK set.
# drovi:
#   firebase:
#     project-id: set-via-DROVI_FIREBASE_PROJECT_ID

drovi:
  # Origin only, no path. This is what a project's base URL is built from, so a wrong
  # value here ends up pasted into every user's codebase. Not a secret.
  public-base-url: ${DROVI_PUBLIC_BASE_URL:http://localhost:8080}

  jobs:
    # The generation job runner's CADENCE. It lives here and not in app_config because
    # @Scheduled resolves its interval once at startup and cannot read a table.
    #
    # Whether the runner claims anything at all IS an app_config row
    # (ai.job.runner.enabled), which is the half that matters during an incident: it can
    # be turned off without a deploy, and it leaves jobs QUEUED rather than failing them.
    #
    # One job per tick, one job in flight. The provider's free tier allows 15 requests a
    # minute and one generation is many sequential calls, so the runner paces itself
    # rather than fanning out. Raising this does not make generation faster; it makes it
    # 429. Check the provider tier before tuning.
    poll-interval-ms: ${DROVI_JOB_POLL_INTERVAL_MS:5000}

    # Let the application finish starting before the first claim. A job that begins while
    # Flyway is still migrating fails for a reason that has nothing to do with the job.
    initial-delay-ms: ${DROVI_JOB_INITIAL_DELAY_MS:15000}

    # Scheduling itself. Off in tests; see SchedulingConfig.
    scheduler-enabled: ${DROVI_JOB_SCHEDULER_ENABLED:true}

server:
  port: ${DROVI_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        # health only. The rest of actuator is not authenticated yet, and this
        # process is reachable from the public internet because of the webhook.
        include: health
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.pm.drovi_backend: ${DROVI_LOG_LEVEL:INFO}
