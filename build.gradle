plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.7'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.pm'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// --- Web ------------------------------------------------------------
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// --- Persistence ----------------------------------------------------
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	// Boot 4 split autoconfiguration into per-technology modules: flyway-core on the
	// classpath no longer triggers FlywayAutoConfiguration on its own, so without
	// this the migrations are silently never run and the app boots on an empty schema.
	implementation 'org.springframework.boot:spring-boot-flyway'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'
	runtimeOnly 'org.postgresql:postgresql'

	// --- Security -------------------------------------------------------
	// Firebase owns identity: we VERIFY ID tokens and never issue them.
	//
	// Deliberately NOT firebase-admin. A Firebase ID token is a standard RS256
	// JWT, and Google publishes the signing keys as a JWK set -- so the OAuth2
	// resource server verifies it with code that is already battle-tested,
	// instead of pulling in the Admin SDK's grpc/google-cloud dependency tree
	// for a 512 MB instance. It also means we need only the project ID, not a
	// service-account credential, to authenticate a caller.
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

	// --- Cache ----------------------------------------------------------
	// Caffeine, not Redis. We run one instance; an in-JVM cache has no network
	// hop, no serialisation and nothing extra to keep alive. See decision #13.
	implementation 'org.springframework.boot:spring-boot-starter-cache'
	implementation 'com.github.ben-manes.caffeine:caffeine'

	// --- Operations -----------------------------------------------------
	implementation 'org.springframework.boot:spring-boot-starter-actuator'

	// --- Boilerplate ----------------------------------------------------
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// --- Test -----------------------------------------------------------
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.security:spring-security-test'
	// Runs a REAL Postgres binary, downloaded as a dependency. No Docker, no
	// Homebrew, nothing for a developer to install — which is the point: a
	// migration that only ever runs against H2 has not been tested.
	testImplementation 'io.zonky.test:embedded-postgres:2.1.0'
	testImplementation enforcedPlatform('io.zonky.test.postgres:embedded-postgres-binaries-bom:17.4.0')
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()

	// The scheduler is off for tests, so no background thread claims generation_job rows
	// while other tests are setting up their fixtures. JobSchedulingTest turns it back on for
	// itself, because "does @Scheduled actually fire" cannot be assumed.
	//
	// A SYSTEM PROPERTY rather than src/test/resources/application.yaml, and that is not a
	// style choice. Boot resolves classpath:/application.yaml to the FIRST match, and the test
	// classes directory comes first — so a test-side file of that name does not add to the main
	// configuration, it REPLACES it. It did, silently, from Phase 3.2 until this was noticed:
	// ddl-auto validate, the Flyway baseline and the log pattern were all absent from every
	// test run, which meant the guard against entity/schema drift was not actually running.
	systemProperty 'drovi.jobs.scheduler-enabled', 'false'
}
